    </g>
    <text x="103" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F4EBDD">swarmandala</text>
    <g font-size="11.5" letter-spacing="1.15" fill="#B9AB97">
      <text x="596" y="46" fill="#F4EBDD">Atlas</text>
      <text x="672" y="46">Prahar clock</text>
      <text x="796" y="46">Compare</text>
      <text x="892" y="46">Practice</text>
      <text x="986" y="46">About</text>
    </g>
    <line x1="596" y1="55" x2="628" y2="55" stroke="#E8A33D" stroke-opacity="0.8"/>
    <rect x="1214" y="22" width="146" height="28" rx="14" stroke="#F4EBDD" stroke-opacity="0.16"/>
    <text x="1287" y="40" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#B9AB97">19:24<tspan fill="#B9AB97" fill-opacity="0.5"> · </tspan><tspan fill="#E8A33D">YAMAN</tspan></text>
  </g>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#F4EBDD" stroke-opacity="0.16"/>

  <!-- page head -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="116" font-size="9.5" letter-spacing="2.5" fill="#E8A33D">THE ATLAS · TWENTY-FOUR RAGAS</text>
  </g>
  <text x="80" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F4EBDD">The atlas</text>
  <text x="80" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9AB97">Twenty-four ragas, sorted by the hour they belong to. Filter by thaat, mood, or season.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="end">
    <text x="1360" y="166" font-size="9" letter-spacing="2" fill="#B9AB97">24 RAGAS · 8 WATCHES</text>
    <text x="1360" y="194" font-size="9" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.65">TRACE A SCALE, HEAR THE HOUR.</text>
  </g>

  <!-- search and controls -->
