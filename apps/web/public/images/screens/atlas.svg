    <rect x="280" y="282" width="104" height="30" rx="15" stroke="#F4EBDD" stroke-opacity="0.14"/>
    <text x="332" y="300.5" text-anchor="middle" fill="#B9AB97">PRATAH 7—10</text>

    <rect x="392" y="282" width="120" height="30" rx="15" stroke="#F4EBDD" stroke-opacity="0.14"/>
    <text x="452" y="300.5" text-anchor="middle" fill="#B9AB97">MADHYANHA 10—13</text>

    <rect x="520" y="282" width="118" height="30" rx="15" stroke="#F4EBDD" stroke-opacity="0.14"/>
