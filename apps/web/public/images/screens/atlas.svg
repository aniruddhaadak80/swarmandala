      <text x="473" y="566" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">भैरवी</text>
      <text x="100" y="600" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">BHAIRAVI THAAT · WATCH 2 · 07—10</text>
      <text x="100" y="622" font-size="10.5" fill="#B9AB97">All komal, all welcome; the close of the night.</text>
      <text x="100" y="638" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  r  g  M  P  d  n</text>
    </g>
    <g>
      <rect x="513" y="518" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="533" y="540" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">05</text>
      <text x="533" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Miyan ki Todi</text>
      <text x="906" y="566" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">मियाँ की तोड़ी</text>
      <text x="533" y="600" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">TODI THAAT · WATCH 3 · 10—13</text>
      <text x="533" y="622" font-size="10.5" fill="#B9AB97">Molten gold; the late morning feels enormous.</text>
      <text x="533" y="638" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  r  g  M  P  d  N</text>
    </g>
    <g>
      <rect x="946" y="518" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="966" y="540" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">06</text>
      <text x="966" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Asavari</text>
      <text x="1339" y="566" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">आसावरी</text>
      <text x="966" y="600" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">ASAVARI THAAT · WATCH 3 · 10—13</text>
      <text x="966" y="622" font-size="10.5" fill="#B9AB97">A hill cool with shade; komal Ga refuses to hurry.</text>
      <text x="966" y="638" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  R  g  M  P  d  n</text>
    </g>

