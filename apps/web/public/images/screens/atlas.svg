      <text x="100" y="714" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Bhimpalasi</text>
      <text x="473" y="712" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">भीमपलासी</text>
      <line x1="100" y1="726" x2="473" y2="726" stroke="#F4EBDD" stroke-opacity="0.10"/>
      <text x="100" y="746" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">KAFI THAAT · WATCH 4 · 13—16</text>
      <text x="100" y="768" font-size="10.5" fill="#B9AB97">Mid-afternoon longing; shuddha Dha on the way down.</text>
      <text x="100" y="784" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  g  M  P  n</text>
    </g>
    <g>
      <rect x="513" y="664" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="533" y="686" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">08</text>
      <text x="533" y="714" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Brindabani Sarang</text>
      <text x="906" y="712" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">बृंदाबनी सारंग</text>
      <line x1="533" y1="726" x2="906" y2="726" stroke="#F4EBDD" stroke-opacity="0.10"/>
      <text x="533" y="746" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">KAFI THAAT · WATCH 4 · 13—16</text>
      <text x="533" y="768" font-size="10.5" fill="#B9AB97">Open, dusty, and cool at the centre.</text>
      <text x="533" y="784" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  R  M  P  N</text>
    </g>
    <g>
      <rect x="946" y="664" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="966" y="686" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">09</text>
      <text x="966" y="714" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Multani</text>
      <text x="1339" y="712" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">मुल्तानी</text>
      <line x1="966" y1="726" x2="1339" y2="726" stroke="#F4EBDD" stroke-opacity="0.10"/>
      <text x="966" y="746" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">TODI THAAT · WATCH 5 · 16—19</text>
      <text x="966" y="768" font-size="10.5" fill="#B9AB97">Heat leaving the stone; the door left ajar.</text>
      <text x="966" y="784" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  g  M  P  N</text>
    </g>
