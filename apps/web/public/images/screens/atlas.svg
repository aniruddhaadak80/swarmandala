    <g>
      <rect x="80" y="372" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="100" y="394" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">01</text>
      <text x="100" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Bhairav</text>
      <text x="473" y="420" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">भैरव</text>
      <text x="100" y="454" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">BHAIRAV THAAT · WATCH 1 · 04—07</text>
      <text x="100" y="476" font-size="10.5" fill="#B9AB97">Grave, wide-awake, slightly austere.</text>
      <text x="100" y="492" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  r  G  M  P  d  N</text>
    </g>
    <g>
      <rect x="513" y="372" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="533" y="394" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">02</text>
      <text x="533" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Lalit</text>
      <text x="906" y="420" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">ललित</text>
      <text x="533" y="454" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">MARWA THAAT · WATCH 1 · 04—07</text>
      <text x="533" y="476" font-size="10.5" fill="#B9AB97">Pre-dawn, both Madhyams burning.</text>
      <text x="533" y="492" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  r  G  M  M^  D  N</text>
    </g>
    <g>
      <rect x="946" y="372" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="966" y="394" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">03</text>
      <text x="966" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#F4EBDD">Ahir Bhairav</text>
      <text x="1339" y="420" text-anchor="end" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="12" fill="#B9AB97">अहीर भैरव</text>
      <text x="966" y="454" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">BHAIRAV THAAT · WATCH 2 · 07—10</text>
      <text x="966" y="476" font-size="10.5" fill="#B9AB97">Bhairav&#8217;s gravity with Kafi&#8217;s warmth.</text>
      <text x="966" y="492" font-size="8.5" letter-spacing="2.4" fill="#E8A33D" fill-opacity="0.85">S  r  G  M  P  D  n</text>
    </g>

