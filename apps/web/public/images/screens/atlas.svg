  <circle cx="104" cy="239" r="6" stroke="#B9AB97" stroke-opacity="0.8"/>
  <line x1="108.5" y1="243.5" x2="113" y2="248" stroke="#B9AB97" stroke-opacity="0.8"/>
  <text x="128" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#B9AB97" fill-opacity="0.7">Search ragas, thaats, moods…</text>
  <text x="782" y="246" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="1.2" fill="#B9AB97" fill-opacity="0.55">CTRL K</text>

