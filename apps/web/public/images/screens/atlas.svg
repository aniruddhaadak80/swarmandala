      <rect x="80" y="518" width="413" height="132" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
      <text x="100" y="540" font-size="8" letter-spacing="1.6" fill="#B9AB97" fill-opacity="0.55">04</text>
