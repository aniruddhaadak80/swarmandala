<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <title>Swarmandala — the atlas</title>
  <desc>Atlas screen: search, watch filters, and a three-column grid of ragas sorted by hour.</desc>

  <defs>
    <radialGradient id="atlasGlow" cx="1180" cy="60" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="#0E0C0A"/>
  <rect width="1440" height="620" fill="url(#atlasGlow)"/>

  <!-- top navigation -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(80 36)">
      <circle r="11.5" stroke="#F4EBDD" stroke-opacity="0.38"/>
