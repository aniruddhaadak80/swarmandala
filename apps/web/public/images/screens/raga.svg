  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="720" y="590" font-size="9" letter-spacing="2.1" fill="#B9AB97">ABOUT THIS RAGA</text>
    <g font-size="13" fill="#B9AB97">
      <text x="720" y="618">Bhairav opens the day with komal Re and komal Dha. Its ascending line is</text>
      <text x="720" y="640">slow to leave the upper Sa, and komal Re is treated as a resting note rather</text>
      <text x="720" y="662">than a passing one. The result is a raga that feels both ancient and alert.</text>
    </g>

    <text x="720" y="704" font-size="9" letter-spacing="2.1" fill="#B9AB97">HEAR IT NEXT</text>
  </g>

