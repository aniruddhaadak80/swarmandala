<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <title>Swarmandala — prahar clock</title>
  <desc>Clock screen: a twenty-four-hour wheel divided into eight prahars, with the current watch and its ragas.</desc>

  <defs>
    <radialGradient id="clockGlow" cx="500" cy="536" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="#0E0C0A"/>
  <rect width="980" height="900" fill="url(#clockGlow)"/>

  <!-- top navigation -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(80 36)">
      <circle r="11.5" stroke="#F4EBDD" stroke-opacity="0.38"/>
      <circle r="4.4" fill="#E8A33D"/>
      <circle cy="-11.5" r="1.6" fill="#F4EBDD"/>
      <circle cx="8.1" cy="8.1" r="1.6" fill="#E8A33D"/>
      <circle cx="-8.1" cy="8.1" r="1.6" fill="#F4EBDD" fill-opacity="0.5"/>
      <circle cx="11.5" cy="0" r="1.1" fill="#F4EBDD" fill-opacity="0.3"/>
      <circle cx="-11.5" cy="0" r="1.1" fill="#F4EBDD" fill-opacity="0.3"/>
    </g>
    <text x="103" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F4EBDD">swarmandala</text>
    <g font-size="11.5" letter-spacing="1.15" fill="#B9AB97">
      <text x="596" y="46">Atlas</text>
      <text x="672" y="46" fill="#F4EBDD">Prahar clock</text>
      <text x="796" y="46">Compare</text>
      <text x="892" y="46">Practice</text>
      <text x="986" y="46">About</text>
    </g>
    <line x1="672" y1="55" x2="758" y2="55" stroke="#E8A33D" stroke-opacity="0.8"/>
    <rect x="1214" y="22" width="146" height="28" rx="14" stroke="#F4EBDD" stroke-opacity="0.16"/>
    <text x="1287" y="40" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#B9AB97">19:24<tspan fill="#B9AB97" fill-opacity="0.5"> · </tspan><tspan fill="#E8A33D">YAMAN</tspan></text>
  </g>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#F4EBDD" stroke-opacity="0.16"/>

  <!-- page head -->
  <text x="80" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="2.5" fill="#E8A33D">THE PRAHAR CLOCK</text>
  <text x="80" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F4EBDD">Eight watches, one day</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B9AB97">
    <text x="80" y="198">Hindustani music keeps time in prahars — three-hour watches that begin at 4am.</text>
    <text x="80" y="218">Drag the hand and the atlas re-tunes.</text>
  </g>
  <text x="1360" y="170" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.8" fill="#B9AB97">WATCH 6 OF 8 · NOW</text>

  <!-- wheel -->
  <g>
    <!-- current watch: pradosha 19.00-22.00 -->
    <path d="M320.34 487.86 L237.27 465.6 A272 272 0 0 1 364 300.44 L407 374.93 A186 186 0 0 0 320.34 487.86 Z" fill="#E8A33D" fill-opacity="0.05"/>
    <path d="M237.27 465.6 A272 272 0 0 1 364 300.44" stroke="#E8A33D" stroke-opacity="0.45" stroke-width="2"/>

    <circle cx="500" cy="536" r="272" stroke="#F4EBDD" stroke-opacity="0.26"/>
    <circle cx="500" cy="536" r="186" stroke="#F4EBDD" stroke-opacity="0.16"/>
    <circle cx="500" cy="536" r="178" stroke="#F4EBDD" stroke-opacity="0.06"/>

    <g stroke="#F4EBDD" stroke-opacity="0.13">
      <line x1="661.08" y1="443" x2="735.56" y2="400"/>
      <line x1="679.66" y1="584.14" x2="762.73" y2="606.4"/>
      <line x1="593" y1="697.08" x2="636" y2="771.56"/>
      <line x1="451.86" y1="715.66" x2="429.6" y2="798.73"/>
      <line x1="338.92" y1="629" x2="264.44" y2="672"/>
      <line x1="320.34" y1="487.86" x2="237.27" y2="465.6"/>
      <line x1="407" y1="374.92" x2="364" y2="300.44"/>
      <line x1="548.14" y1="356.34" x2="570.4" y2="273.27"/>
    </g>

    <!-- twenty-four hour marks -->
    <g fill="#F4EBDD" fill-opacity="0.22">
      <circle cx="572.21" cy="266.51" r="1.1"/>
      <circle cx="639.5" cy="294.38" r="1.1"/>
      <circle cx="741.62" cy="396.5" r="1.1"/>
      <circle cx="769.49" cy="463.79" r="1.1"/>
      <circle cx="769.49" cy="608.21" r="1.1"/>
      <circle cx="741.62" cy="675.5" r="1.1"/>
      <circle cx="639.5" cy="777.62" r="1.1"/>
      <circle cx="572.21" cy="805.49" r="1.1"/>
      <circle cx="427.79" cy="805.49" r="1.1"/>
      <circle cx="360.5" cy="777.62" r="1.1"/>
      <circle cx="258.38" cy="675.5" r="1.1"/>
      <circle cx="230.51" cy="608.21" r="1.1"/>
      <circle cx="230.51" cy="463.79" r="1.1"/>
      <circle cx="258.38" cy="396.5" r="1.1"/>
      <circle cx="360.5" cy="294.38" r="1.1"/>
      <circle cx="427.79" cy="266.51" r="1.1"/>
    </g>
    <g fill="#E8A33D" fill-opacity="0.62">
      <circle cx="500" cy="257" r="2"/>
      <circle cx="697.28" cy="338.72" r="2"/>
      <circle cx="779" cy="536" r="2"/>
      <circle cx="697.28" cy="733.28" r="2"/>
      <circle cx="500" cy="815" r="2"/>
      <circle cx="302.72" cy="733.28" r="2"/>
      <circle cx="221" cy="536" r="2"/>
      <circle cx="302.72" cy="338.72" r="2"/>
    </g>

    <!-- watch labels -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
      <g fill="#B9AB97">
        <text x="730.02" y="502.72" font-size="9" letter-spacing="1.4">BHOR</text>
        <text x="730.02" y="516.72" font-size="8" letter-spacing="0.8" fill-opacity="0.55">04—07</text>
        <text x="684.06" y="674.23" font-size="9" letter-spacing="1.4">PRATAH</text>
        <text x="684.06" y="688.23" font-size="8" letter-spacing="0.8" fill-opacity="0.55">07—10</text>
        <text x="530.28" y="763.02" font-size="9" letter-spacing="1.4">MADHYANHA</text>
        <text x="530.28" y="777.02" font-size="8" letter-spacing="0.8" fill-opacity="0.55">10—13</text>
        <text x="358.77" y="717.06" font-size="9" letter-spacing="1.4">APARANHA</text>
        <text x="358.77" y="731.06" font-size="8" letter-spacing="0.8" fill-opacity="0.55">13—16</text>
        <text x="269.98" y="563.28" font-size="9" letter-spacing="1.4">SAYANKAL</text>
        <text x="269.98" y="577.28" font-size="8" letter-spacing="0.8" fill-opacity="0.55">16—19</text>
        <text x="469.72" y="302.98" font-size="9" letter-spacing="1.4">RATRI</text>
        <text x="469.72" y="316.98" font-size="8" letter-spacing="0.8" fill-opacity="0.55">22—01</text>
        <text x="641.23" y="348.94" font-size="9" letter-spacing="1.4">NISHITH</text>
        <text x="641.23" y="362.94" font-size="8" letter-spacing="0.8" fill-opacity="0.55">01—04</text>
      </g>
      <text x="315.94" y="390.77" font-size="9" letter-spacing="1.4" fill="#E8A33D">PRADOSHA</text>
      <text x="315.94" y="404.77" font-size="8" letter-spacing="0.8" fill="#E8A33D" fill-opacity="0.7">19—22</text>
    </g>

    <!-- hand -->
    <line x1="500" y1="536" x2="287.14" y2="454.29" stroke="#E8A33D" stroke-opacity="0.85" stroke-width="2"/>
    <circle cx="287.14" cy="454.29" r="5" fill="#0E0C0A" stroke="#E8A33D" stroke-width="2"/>

    <!-- hub -->
    <circle cx="500" cy="536" r="74" stroke="#E8A33D" stroke-opacity="0.2"/>
    <circle cx="500" cy="536" r="66" fill="#E8A33D"/>
    <text x="500" y="544" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#0E0C0A">19:24</text>
    <text x="500" y="562" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1.8" fill="#0E0C0A" fill-opacity="0.7">PRADOSHA</text>
  </g>

  <!-- suggested raga -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="860" y="278" font-size="9" letter-spacing="2.2" fill="#B9AB97">SUGGESTED FOR THIS WATCH</text>
  </g>
  <rect x="860" y="290" width="500" height="274" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.14"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="884" y="318" font-size="8.5" letter-spacing="1.7" fill="#E8A33D">PRADOSHA · WATCH 6</text>
    <text x="1336" y="318" text-anchor="end" font-size="8.5" letter-spacing="1.4" fill="#B9AB97">19—22</text>
    <text x="884" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#F4EBDD">Yaman</text>
    <text x="1040" y="370" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="18" fill="#B9AB97">यमन</text>
    <line x1="884" y1="392" x2="1336" y2="392" stroke="#F4EBDD" stroke-opacity="0.12"/>
    <text x="884" y="416" font-size="9" letter-spacing="1.6" fill="#B9AB97">KALYAN THAAT · VADI GA · SAMVADI NI</text>

    <g>
      <rect x="884" y="430" width="56" height="32" rx="2" stroke="#E8A33D" stroke-opacity="0.4"/>
      <text x="912" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#E8A33D">S</text>
      <rect x="948" y="430" width="56" height="32" rx="2" stroke="#F4EBDD" stroke-opacity="0.13"/>
      <text x="976" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#F4EBDD">R</text>
      <rect x="1012" y="430" width="56" height="32" rx="2" stroke="#F4EBDD" stroke-opacity="0.13"/>
      <text x="1040" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#F4EBDD">G</text>
      <rect x="1076" y="430" width="56" height="32" rx="2" stroke="#F4EBDD" stroke-opacity="0.13"/>
      <text x="1104" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#F4EBDD">M^</text>
      <rect x="1140" y="430" width="56" height="32" rx="2" stroke="#F4EBDD" stroke-opacity="0.13"/>
      <text x="1168" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#F4EBDD">P</text>
      <rect x="1204" y="430" width="56" height="32" rx="2" stroke="#F4EBDD" stroke-opacity="0.13"/>
      <text x="1232" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#F4EBDD">D</text>
      <rect x="1268" y="430" width="56" height="32" rx="2" stroke="#F4EBDD" stroke-opacity="0.13"/>
      <text x="1296" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#F4EBDD">N</text>
    </g>

    <text x="884" y="490" font-size="11.5" fill="#B9AB97">The first raga of the evening — tivra Ma catches the lamplight.</text>
    <text x="884" y="508" font-size="11.5" fill="#B9AB97">Seven notes; tivra Ma is the signature. Ni is touched softly.</text>
    <text x="884" y="540" font-size="9.5" letter-spacing="1.5" fill="#E8A33D">HEAR THE SCALE →</text>
  </g>

  <!-- rest of the watch -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="860" y="598" font-size="9" letter-spacing="2.2" fill="#B9AB97">ALSO IN THIS WATCH</text>

    <text x="860" y="626" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#F4EBDD">Bhupali</text>
    <text x="860" y="644" font-size="8.5" letter-spacing="1.2" fill="#B9AB97">5 NOTES · AUDAVA · KALYAN THAAT</text>
    <text x="1348" y="632" text-anchor="end" font-size="13" fill="#E8A33D">→</text>
    <line x1="860" y1="660" x2="1360" y2="660" stroke="#F4EBDD" stroke-opacity="0.10"/>

    <text x="860" y="686" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#F4EBDD">Hamsadhwani</text>
    <text x="860" y="704" font-size="8.5" letter-spacing="1.2" fill="#B9AB97">5 NOTES · AUDAVA · BILAVAL THAAT</text>
    <text x="1348" y="692" text-anchor="end" font-size="13" fill="#E8A33D">→</text>
    <line x1="860" y1="720" x2="1360" y2="720" stroke="#F4EBDD" stroke-opacity="0.10"/>

    <text x="860" y="746" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#F4EBDD">Durga</text>
    <text x="860" y="764" font-size="8.5" letter-spacing="1.2" fill="#B9AB97">5 NOTES · AUDAVA · BILAVAL THAAT</text>
    <text x="1348" y="752" text-anchor="end" font-size="13" fill="#E8A33D">→</text>
    <line x1="860" y1="780" x2="1360" y2="780" stroke="#F4EBDD" stroke-opacity="0.10"/>

    <text x="860" y="812" font-size="9" letter-spacing="1.4" fill="#B9AB97">NEXT — RATRI · 22:00 · BAGESHRI, KAFI, MALKAUNS</text>
  </g>

  <text x="80" y="812" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.4" fill="#B9AB97" fill-opacity="0.65">DRAG THE HAND, OR USE THE ARROW KEYS.</text>

  <!-- footer -->
  <line x1="80" y1="832" x2="1360" y2="832" stroke="#F4EBDD" stroke-opacity="0.16"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.8" fill="#B9AB97" fill-opacity="0.7">
    <text x="80" y="856">SWARMANDALA · BUILT IN KOLKATA</text>
    <text x="1360" y="856" text-anchor="end">CLOCK — 04 / 06</text>
  </g>
</svg>
