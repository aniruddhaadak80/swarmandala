    <circle cx="1070" cy="592" r="5" fill="#E8A33D"/>
    <circle cx="963" cy="563.33" r="5" fill="#E8A33D"/>
    <circle cx="884.67" cy="485" r="2.4" fill="#F4EBDD" fill-opacity="0.24"/>
    <circle cx="856" cy="378" r="5" fill="#E8A33D"/>
    <circle cx="884.67" cy="271" r="2.4" fill="#F4EBDD" fill-opacity="0.24"/>
    <circle cx="963" cy="192.67" r="2.4" fill="#F4EBDD" fill-opacity="0.24"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.2" fill="#E8A33D">
      <text x="1070" y="132" text-anchor="middle">Sa</text>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" fill="#0E0C0A" text-anchor="middle">
      <text x="1070" y="386" font-size="40">19:24</text>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#0E0C0A" text-anchor="middle">
      <text x="1070" y="412" font-size="8.5" letter-spacing="1.8" fill-opacity="0.7">PRADOSHA · WATCH 6</text>
      <text x="1070" y="443" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="4.5" fill-opacity="0.85">YAMAN</text>
    </g>
  </g>

  <text x="1070" y="646" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#B9AB97">At 19:24, the atlas suggests <tspan fill="#E8A33D">Yaman</tspan> — tivra Ma catches the lamplight.</text>

  <!-- in the atlas now -->
  <line x1="80" y1="692" x2="1360" y2="692" stroke="#F4EBDD" stroke-opacity="0.16"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="722" font-size="9" letter-spacing="2.1" fill="#B9AB97">IN THE ATLAS NOW · PRADOSHA</text>
    <text x="1360" y="722" text-anchor="end" font-size="9" letter-spacing="1.8" fill="#E8A33D">ALL 24 RAGAS →</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="80" y="738" width="400" height="78" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
    <rect x="80" y="738" width="2" height="78" fill="#E8A33D"/>
    <text x="100" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F4EBDD">Yaman</text>
    <text x="100" y="786" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="11" fill="#B9AB97">यमन</text>
    <text x="460" y="766" text-anchor="end" font-size="8.5" letter-spacing="1.6" fill="#B9AB97">WATCH 6 · 19—22</text>
    <text x="460" y="796" text-anchor="end" font-size="10.5" fill="#B9AB97">Tivra Ma catches the lamplight.</text>

    <rect x="500" y="738" width="400" height="78" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
    <text x="520" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F4EBDD">Bhupali</text>
    <text x="520" y="786" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="11" fill="#B9AB97">भूपाली</text>
    <text x="880" y="766" text-anchor="end" font-size="8.5" letter-spacing="1.6" fill="#B9AB97">WATCH 6 · 19—22</text>
    <text x="880" y="796" text-anchor="end" font-size="10.5" fill="#B9AB97">Five notes, no Ma, no Ni.</text>

    <rect x="920" y="738" width="400" height="78" rx="2" fill="#171310" stroke="#F4EBDD" stroke-opacity="0.12"/>
    <text x="940" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F4EBDD">Hamsadhwani</text>
    <text x="940" y="786" font-family="'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif" font-size="11" fill="#B9AB97">हंसध्वनि</text>
    <text x="1300" y="766" text-anchor="end" font-size="8.5" letter-spacing="1.6" fill="#B9AB97">WATCH 6 · 19—22</text>
    <text x="1300" y="796" text-anchor="end" font-size="10.5" fill="#B9AB97">Arrives already smiling.</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="832" x2="1360" y2="832" stroke="#F4EBDD" stroke-opacity="0.16"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.8" fill="#B9AB97" fill-opacity="0.7">
    <text x="80" y="856">SWARMANDALA · BUILT IN KOLKATA</text>
    <text x="1360" y="856" text-anchor="end">HOME — 01 / 06</text>
