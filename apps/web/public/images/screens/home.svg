    </g>
    <text x="103" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F4EBDD">swarmandala</text>

    <g font-size="11.5" letter-spacing="1.15" fill="#B9AB97">
      <text x="596" y="46">Atlas</text>
      <text x="672" y="46">Prahar clock</text>
      <text x="796" y="46">Compare</text>
      <text x="892" y="46">Practice</text>
      <text x="986" y="46">About</text>
    </g>

    <rect x="1214" y="22" width="146" height="28" rx="14" stroke="#F4EBDD" stroke-opacity="0.16"/>
    <text x="1287" y="40" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#B9AB97">19:24<tspan fill="#B9AB97" fill-opacity="0.5"> · </tspan><tspan fill="#E8A33D">YAMAN</tspan></text>
  </g>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#F4EBDD" stroke-opacity="0.16"/>

  <!-- hero copy -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="152" font-size="10" letter-spacing="2.7" fill="#E8A33D">A LIVING ATLAS OF HINDUSTANI RAGA</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#F4EBDD">
    <text x="80" y="254" font-size="80">The day has</text>
    <text x="80" y="332" font-size="80">a scale<tspan fill="#E8A33D">.</tspan></text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#B9AB97">
    <text x="80" y="376">Twenty-four ragas, each tied to a watch of the day. Tune a drone,</text>
    <text x="80" y="400">trace a scale, and find out what 6pm is supposed to sound like.</text>
  </g>

  <rect x="80" y="434" width="190" height="46" rx="23" fill="#E8A33D"/>
  <text x="175" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#0E0C0A">ENTER THE ATLAS</text>
  <rect x="286" y="434" width="226" height="46" rx="23" stroke="#F4EBDD" stroke-opacity="0.24"/>
  <text x="399" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.3" fill="#F4EBDD">WHAT IS PLAYING NOW?</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#B9AB97">
    <circle cx="84" cy="507" r="2" fill="#E8A33D" fill-opacity="0.8"/>
    <text x="96" y="511">Sound stays off until you ask for it.</text>
  </g>

