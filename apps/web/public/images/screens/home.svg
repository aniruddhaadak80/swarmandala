    <path d="M890 378 A180 180 0 0 1 980 222.12" stroke="#E8A33D" stroke-opacity="0.52" stroke-width="1.4"/>
    <path d="M980 222.12 A180 180 0 0 1 1070 198" stroke="#E8A33D" stroke-opacity="0.52" stroke-width="1.4"/>
    <circle cx="1177" cy="222.12" r="2" fill="#C94F35" fill-opacity="0.55"/>

    <circle cx="1070" cy="378" r="108" fill="#E8A33D"/>
    <circle cx="1070" cy="378" r="99" stroke="#0E0C0A" stroke-opacity="0.09"/>
    <circle cx="1070" cy="378" r="118" stroke="#E8A33D" stroke-opacity="0.22"/>

    <!-- twelve swara positions -->
    <circle cx="1070" cy="164" r="8" fill="#F4EBDD"/>
    <circle cx="1070" cy="164" r="13" stroke="#E8A33D" stroke-opacity="0.55"/>
    <circle cx="1177" cy="192.67" r="2.4" fill="#F4EBDD" fill-opacity="0.24"/>
    <circle cx="1255.33" cy="271" r="5" fill="#E8A33D"/>
    <circle cx="1284" cy="378" r="2.4" fill="#F4EBDD" fill-opacity="0.24"/>
