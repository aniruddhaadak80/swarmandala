<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <title>Swarmandala — The day has a scale.</title>
  <desc>Social card: the swara mandala mark, the wordmark, and the line The day has a scale.</desc>

  <defs>
    <radialGradient id="ogGlow" cx="900" cy="280" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0E0C0A"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect x="28" y="28" width="1144" height="574" stroke="#F4EBDD" stroke-opacity="0.13"/>

  <!-- header -->
  <g transform="translate(79 77)">
    <circle r="12" stroke="#F4EBDD" stroke-opacity="0.35"/>
    <circle r="4.6" fill="#E8A33D"/>
    <circle cy="-12" r="1.7" fill="#F4EBDD"/>
    <circle cx="8.5" cy="8.5" r="1.7" fill="#E8A33D"/>
    <circle cx="-8.5" cy="8.5" r="1.7" fill="#F4EBDD" fill-opacity="0.5"/>
  </g>
  <text x="108" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#F4EBDD">swarmandala</text>
  <text x="1122" y="84" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.7" fill="#B9AB97">A LIVING ATLAS OF HINDUSTANI RAGA</text>

  <!-- headline -->
  <text x="80" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#F4EBDD">The day has</text>
  <text x="80" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#F4EBDD">a scale<tspan fill="#E8A33D">.</tspan></text>
  <text x="82" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#B9AB97">Twenty-four ragas, each tied to a watch of the day.</text>
  <text x="82" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#B9AB97">Tune a drone, trace a scale, hear the hour.</text>

  <!-- mark -->
  <g transform="translate(784 154) scale(1.18)">
    <circle cx="128" cy="128" r="96" stroke="#F4EBDD" stroke-opacity="0.10"/>
    <circle cx="128" cy="128" r="84" stroke="#F4EBDD" stroke-opacity="0.30"/>
    <circle cx="128" cy="128" r="74" stroke="#F4EBDD" stroke-opacity="0.08"/>
    <path d="M128 60 A68 68 0 0 1 186.89 94" stroke="#E8A33D" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M186.89 94 A68 68 0 0 1 186.89 162" stroke="#E8A33D" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M186.89 162 A68 68 0 0 1 94 186.89" stroke="#E8A33D" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M94 186.89 A68 68 0 0 1 60 128" stroke="#E8A33D" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M60 128 A68 68 0 0 1 128 60" stroke="#C94F35" stroke-opacity="0.38" stroke-width="1.1" stroke-dasharray="1 6" stroke-linecap="round"/>
    <circle cx="128" cy="128" r="48" stroke="#E8A33D" stroke-opacity="0.28"/>
    <circle cx="128" cy="128" r="40" fill="#E8A33D"/>
    <circle cx="128" cy="128" r="31" stroke="#0E0C0A" stroke-opacity="0.10"/>
    <circle cx="128" cy="44" r="8.5" fill="#E8A33D"/>
    <circle cx="128" cy="44" r="13" stroke="#F4EBDD" stroke-opacity="0.30"/>
    <circle cx="170" cy="55.25" r="2.2" fill="#F4EBDD" fill-opacity="0.30"/>
    <circle cx="200.75" cy="86" r="4.4" fill="#E8A33D"/>
    <circle cx="212" cy="128" r="2.2" fill="#F4EBDD" fill-opacity="0.30"/>
    <circle cx="200.75" cy="170" r="4.4" fill="#E8A33D"/>
    <circle cx="170" cy="200.75" r="2.2" fill="#F4EBDD" fill-opacity="0.30"/>
    <circle cx="128" cy="212" r="2.2" fill="#F4EBDD" fill-opacity="0.30"/>
    <circle cx="86" cy="200.75" r="4.4" fill="#E8A33D"/>
    <circle cx="55.25" cy="170" r="2.2" fill="#F4EBDD" fill-opacity="0.30"/>
    <circle cx="44" cy="128" r="4.4" fill="#E8A33D"/>
    <circle cx="55.25" cy="86" r="2.2" fill="#F4EBDD" fill-opacity="0.30"/>
    <circle cx="86" cy="55.25" r="2.2" fill="#F4EBDD" fill-opacity="0.30"/>
    <text x="128" y="25" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.8" fill="#E8A33D">Sa</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="508" x2="1120" y2="508" stroke="#F4EBDD" stroke-opacity="0.16"/>
  <text x="80" y="552" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#F4EBDD">Hear the hour<tspan fill="#E8A33D">.</tspan></text>
  <text x="80" y="578" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="2" fill="#B9AB97">24 RAGAS · 8 PRAHARS · ZERO SAMPLES</text>
  <rect x="940" y="526" width="180" height="42" rx="21" fill="#E8A33D"/>
  <text x="1030" y="552" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.9" fill="#0E0C0A">ENTER THE ATLAS</text>
</svg>
