# Manual Vercel deploy.
#
# There is deliberately NO push trigger. Automatic deployments belong to
# Vercel's Git integration, and this workflow exists for the cases it does not
# cover: redeploying a specific commit, or checking that the CLI path still
# works. Nothing here runs unless a maintainer starts it by hand.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       https://vercel.com/account/tokens
#   VERCEL_ORG_ID      from `.vercel/project.json` after `vercel link`
#   VERCEL_PROJECT_ID  from `.vercel/project.json` after `vercel link`
#
# No secrets are committed and none are echoed. If they are missing, the
# preflight step fails before anything is deployed.
#
# The project root in Vercel must be configured as `apps/web`, matching
# `working-directory` below. `bun.lock` lives at the repository root.

name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production. Leave unchecked for a preview URL."
        type: boolean
        required: false
        default: false
      ref:
        description: "Git ref to deploy (branch, tag, or SHA). Defaults to the branch selected above."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy apps/web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Check deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy
        id: deploy
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          # v25 has no `target` input: no args means preview, `--prod` promotes.
          vercel-args: ${{ inputs.production && '--prod' || '' }}
          # This workflow is not tied to a pull request; skip commit comments.
          github-comment: "false"

      - name: Write the deployment summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.preview-url }}
        shell: bash
        run: |
          {
            echo "### Vercel deploy"
            echo ""
            echo "- Target: ${{ inputs.production && 'production' || 'preview' }}"
            echo "- Ref: \`${{ inputs.ref || github.ref }}\`"
            echo "- URL: ${DEPLOY_URL:-see the deploy step log}"
          } >> "$GITHUB_STEP_SUMMARY"
