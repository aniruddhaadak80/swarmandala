name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run obsolete. Cancel it
# rather than paying for two identical builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The whole suite is read-only: no deployments, no comments, no secrets.
permissions:
  contents: read

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Track the 1.x line; bun.lock pins the actual dependency graph.
          bun-version: "1.x"

      - name: Cache Bun downloads and Turbo output
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format check
        run: bun run lint

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Production build
        run: bun run build

      # Playwright's webServer runs `next start`, so this must come after the
      # build. --with-deps installs the Linux libraries Chromium needs.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bunx playwright test

      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
